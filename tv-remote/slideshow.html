<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>TV Photos</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        cursor: none;
      }

      #photo {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>

  <body>
    <img id="photo" alt="" />

    <script>
      const PHOTO_API =
        "http://192.168.1.187:8765/photos";

      const DISPLAY_TIME = 20000;

      const photoElement =
        document.getElementById("photo");

      let photos = [];
      let currentIndex = 0;

      async function loadPhotos() {
        const response =
          await fetch(PHOTO_API);

        const data =
          await response.json();

        photos = data.photos || [];

        if (photos.length === 0) {
          return;
        }

        showPhoto();

        setInterval(() => {
          currentIndex =
            (currentIndex + 1) %
            photos.length;

          showPhoto();
        }, DISPLAY_TIME);
      }

      function showPhoto() {
        photoElement.src =
          photos[currentIndex];
      }

      loadPhotos();
    </script>
  </body>
</html>
