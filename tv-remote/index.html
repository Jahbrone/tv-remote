<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>TV Remote</title>

    <link rel="manifest" href="manifest.json" />

    <meta name="theme-color" content="#111111" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="stylesheet" href="style.css?v=1.0.4" />
  </head>

  <body>
    <main class="remote">
      <!-- TOP CONTROLS -->
      <header class="top-bar">
        <button
          class="icon-button power-button"
          id="powerButton"
          data-command="power"
          aria-label="Power"
        >
          <img src="img/power.svg" alt="Power" />
        </button>

        <div class="volume-controls">
          <button
            class="icon-button volume-button"
            data-command="volume-down"
            aria-label="Volume down"
          >
            −
          </button>

          <span>VOL</span>

          <button
            class="icon-button volume-button"
            data-command="volume-up"
            aria-label="Volume up"
          >
            +
          </button>
        </div>

        <button
          class="icon-button desktop-button"
          data-command="desktop"
          aria-label="Desktop"
        >
          <img src="img/home.svg" alt="Desktop" />
        </button>
      </header>

      <!-- SERVICES -->
      <section class="app-grid">
        <button class="app-button" data-command="netflix" aria-label="Netflix">
          <img src="img/netflix.svg" alt="Netflix" />
        </button>

        <button class="app-button" data-command="disney" aria-label="Disney+">
          <img src="img/disney.svg" alt="Disney+" />
        </button>

        <button class="app-button" data-command="max" aria-label="Max">
          <img src="img/hbo.svg" alt="Max" />
        </button>

        <button class="app-button" data-command="youtube" aria-label="YouTube">
          <img src="img/youtube.svg" alt="YouTube" />
        </button>

        <button class="app-button" data-command="yle" aria-label="Yle">
          <img src="img/yle.svg" alt="Yle" />
        </button>

        <button class="app-button" data-command="web" aria-label="Internet">
          <img src="img/internet.svg" alt="Internet" />
        </button>

        <button class="app-button" data-command="steam" aria-label="Steam">
          <img src="img/steam.svg" alt="Steam" />
        </button>

        <button class="app-button" data-command="retro" aria-label="Retro">
          <img src="img/retro.svg" alt="Retro" />
        </button>

        <button
          class="app-button"
          data-command="screensaver"
          aria-label="Photos"
        >
          <img src="img/photo.svg" alt="Photos" />
        </button>
      </section>

      <!-- PERMANENT TRACKPAD -->
      <footer class="bottom-controls">
        <div class="bottom-action-row">
          <button
            class="keyboard-button"
            id="openKeyboardButton"
            aria-label="Keyboard"
          >
            <img src="img/keyboard.svg" alt="" />
            
          </button>
          <button
            class="close-apps-button"
            id="closeAppsButton"
            aria-label="Close Apps"
          >
            CLOSE APPS
          </button>
        </div>

        <div class="trackpad-shell">
          <div class="trackpad" id="trackpad">
            <span>Trackpad</span>
          </div>

          <div class="mouse-buttons">
            <button class="mouse-button" data-command="left-click">
              Left Click
            </button>

            <button class="mouse-button" data-command="right-click">
              Right Click
            </button>
          </div>
        </div>
      </footer>

      <!-- HIDDEN PHONE KEYBOARD INPUT -->
      <textarea
        id="keyboardInput"
        class="hidden-keyboard-input"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      ></textarea>
    </main>

    <script src="app.js?v=1.0.4"></script>
  </body>
</html>
