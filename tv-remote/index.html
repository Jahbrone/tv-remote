<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TV Remote</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="remote">
      <!-- TOP CONTROLS -->
      <header class="top-bar">
        <button
          class="icon-button power-button"
          id="powerButton"
          data-command="power"
          aria-label="Power"
        >
          <img src="img/power.svg" alt="Power" />
        </button>

        <div class="volume-controls">
          <button
            class="icon-button volume-button"
            id="volumeDown"
            data-command="volume-down"
          >
            −
          </button>

          <span>VOL</span>

          <button
            class="icon-button volume-button"
            id="volumeUp"
            data-command="volume-up"
          >
            +
          </button>
        </div>

        <button
          class="icon-button desktop-button"
          id="desktopButton"
          data-command="desktop"
          aria-label="Desktop"
        >
          <img src="img/home.svg" alt="Desktop" />
        </button>
      </header>

      <!-- SERVICES -->
      <section class="app-grid">
        <button class="app-button" data-command="netflix" aria-label="Netflix">
          <img src="img/netflix.svg" alt="Netflix" />
        </button>

        <button class="app-button" data-command="disney" aria-label="Disney+">
          <img src="img/disney.svg" alt="Disney+" />
        </button>

        <button class="app-button" data-command="max" aria-label="Max">
          <img src="img/hbo.svg" alt="Max" />
        </button>

        <button class="app-button" data-command="youtube" aria-label="YouTube">
          <img src="img/youtube.svg" alt="YouTube" />
        </button>

        <button class="app-button" data-command="yle" aria-label="Yle">
          <img src="img/yle.svg" alt="Yle" />
        </button>

        <button class="app-button" data-command="web" aria-label="Internet">
          <img src="img/internet.svg" alt="Internet" />
        </button>

        <button class="app-button" data-command="steam" aria-label="Steam">
          <img src="img/steam.svg" alt="Steam" />
        </button>

        <button class="app-button" data-command="retro" aria-label="Retro">
          <img src="img/retro.svg" alt="Retro" />
        </button>
        <button
          class="app-button"
          data-command="screensaver"
          aria-label="Screensaver"
        >
          <img src="img/photo.svg" alt="photo" />
        </button>
      </section>

      <!-- KEYBOARD / TRACKPAD BUTTON -->
      <footer class="bottom-controls">
        <button
          class="control-button"
          id="inputButton"
          data-command="input"
          aria-label="Keyboard and Trackpad"
        >
          <img src="img/keyboard.svg" alt="" />
          <img src="img/mouse.svg" alt="" />
        </button>
      </footer>
    </main>

    <!-- KEYBOARD + TRACKPAD POPUP -->
    <div class="input-panel" id="inputPanel">
      <div class="input-panel-header">
        <span>Keyboard & Trackpad</span>

        <button id="closeInputPanel">✕</button>
      </div>

      <!-- TRACKPAD -->
      <div class="trackpad" id="trackpad">
        <span>Trackpad</span>
      </div>

      <!-- MOUSE BUTTONS -->
      <div class="mouse-buttons">
        <button
          class="mouse-button"
          id="leftClickButton"
          data-command="left-click"
        >
          Left Click
        </button>

        <button
          class="mouse-button"
          id="rightClickButton"
          data-command="right-click"
        >
          Right Click
        </button>
      </div>

      <!-- KEYBOARD INPUT -->
      <input
        type="text"
        id="keyboardInput"
        placeholder="Tap here to type"
        autocomplete="off"
      />
    </div>

    <script src="app.js?v=3"></script>
  </body>
</html>
