<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TV Remote</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <main class="remote">

      <!-- TOP CONTROLS -->
      <header class="top-bar">

        <!-- Power -->
        <button
          class="icon-button"
          id="powerButton"
          data-command="power"
        >
          ⏻
        </button>

        <!-- Volume -->
        <div class="volume-controls">

          <button
            class="icon-button"
            id="volumeDown"
            data-command="volume-down"
          >
            −
          </button>

          <span>VOL</span>

          <button
            class="icon-button"
            id="volumeUp"
            data-command="volume-up"
          >
            +
          </button>

        </div>

        <!-- Desktop -->
        <button
          class="icon-button"
          id="desktopButton"
          data-command="desktop"
        >
          Desktop
        </button>

      </header>


      <!-- SERVICES -->
      <section class="app-grid">

        <button class="app-button" data-command="netflix">
          Netflix
        </button>

        <button class="app-button" data-command="disney">
          Disney+
        </button>

        <button class="app-button" data-command="max">
          Max
        </button>

        <button class="app-button" data-command="youtube">
          YouTube
        </button>

        <button class="app-button" data-command="yle">
          Yle
        </button>

        <button class="app-button" data-command="web">
          Web
        </button>

        <button class="app-button" data-command="steam">
          Steam
        </button>

        <button class="app-button" data-command="retro">
          Retro
        </button>

      </section>


      <!-- KEYBOARD / TRACKPAD BUTTON -->
      <footer class="bottom-controls">

        <button
          class="control-button"
          id="inputButton"
          data-command="input"
        >
          ⌨ Keyboard & Trackpad
        </button>

      </footer>

    </main>


    <!-- KEYBOARD + TRACKPAD POPUP -->
    <div class="input-panel" id="inputPanel">

      <div class="input-panel-header">

        <span>Keyboard & Trackpad</span>

        <button id="closeInputPanel">
          ✕
        </button>

      </div>


      <!-- Trackpad -->
      <div class="trackpad" id="trackpad">
        <span>Trackpad</span>
      </div>


      <!-- Opens phone's native keyboard -->
      <input
        type="text"
        id="keyboardInput"
        placeholder="Tap here to type"
        autocomplete="off"
      />

    </div>


    <script src="app.js"></script>

  </body>
</html>
